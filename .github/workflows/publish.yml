name: publish-flatpak-repo

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'   # weekly Monday 04:00 UTC

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push gh-pages

    steps:
      - uses: actions/checkout@v4

      - name: Install Flatpak and OSTree
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y flatpak ostree
          flatpak --version
          ostree --version

      - name: Download JobDocs Flatpak bundle
        run: |
          mkdir -p bundles
          gh release download \
            --repo i-machine-things-org/JobDocs \
            --pattern 'JobDocs-linux.flatpak' \
            --dir bundles/ \
            --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download HoneyBatchr Flatpak bundle
        run: |
          gh release download \
            --repo i-machine-things/HoneyBatchr \
            --pattern 'HoneyBatchr-*-linux.flatpak' \
            --dir bundles/ \
            --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: List downloaded bundles
        run: ls -lh bundles/

      - name: Initialise OSTree repo
        run: |
          mkdir -p publish/repo
          ostree init --repo=publish/repo --mode=archive-z2
          echo "=== repo structure ==="
          find publish/repo -maxdepth 3 | sort
          echo "=== config ==="
          cat publish/repo/config

      - name: Import bundles into OSTree repo
        run: |
          for bundle in bundles/*.flatpak; do
            echo "--- Importing $bundle ---"
            flatpak build-import-bundle publish/repo "$bundle"
          done

      - name: Update repo summary
        run: flatpak build-update-repo publish/repo

      - name: Copy static files
        run: |
          cp i-machine-things.flatpakrepo publish/
          cp index.html publish/

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: publish/
          force_orphan: true
